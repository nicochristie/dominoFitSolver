[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "dominoFitSolver"
version = "0.1"
description = "A dominoFit solver for https://dominofit.isotropic.us/ because I was bored"
keywords = ["Domino", "Fit", "DominoFit"]
authors = [
  { name = "Nico", email = "nicolas.christie@gmail.com" },
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "primp",
  "protobuf",
  "selectolax",
  "flask",
  "flask_cors",
  "svgwrite",
  "ortools"
]
